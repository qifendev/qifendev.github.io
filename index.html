<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>qifen | Developer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

    :root {
      --bg-primary: #0a0a0f;
      --bg-card: rgba(255,255,255,0.03);
      --bg-card-hover: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.06);
      --border-hover: rgba(255,255,255,0.12);
      --text-primary: #f0f0f5;
      --text-secondary: rgba(255,255,255,0.5);
      --accent: #6366f1;
      --accent-glow: rgba(99,102,241,0.3);
      --gradient-1: #6366f1;
      --gradient-2: #a855f7;
      --gradient-3: #ec4899;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .bg-orbs {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.4;
      animation: float 20s ease-in-out infinite;
    }

    .orb-1 {
      width: 600px; height: 600px;
      background: var(--gradient-1);
      top: -200px; left: -100px;
      animation-delay: 0s;
    }

    .orb-2 {
      width: 500px; height: 500px;
      background: var(--gradient-2);
      top: 40%; right: -150px;
      animation-delay: -7s;
    }

    .orb-3 {
      width: 400px; height: 400px;
      background: var(--gradient-3);
      bottom: -100px; left: 30%;
      animation-delay: -14s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -30px) scale(1.05); }
      66% { transform: translate(-20px, 20px) scale(0.95); }
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: 720px;
      margin: 0 auto;
      padding: 60px 24px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      justify-content: center;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 28px;
      background: linear-gradient(135deg, var(--gradient-1), var(--gradient-2), var(--gradient-3));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      font-weight: 800;
      color: white;
      margin-bottom: 24px;
      box-shadow: 0 0 60px var(--accent-glow);
      animation: pulse-glow 4s ease-in-out infinite;
      position: relative;
    }

    .avatar::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 30px;
      background: linear-gradient(135deg, var(--gradient-1), var(--gradient-2), var(--gradient-3));
      z-index: -1;
      filter: blur(16px);
      opacity: 0.5;
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 40px var(--accent-glow); }
      50% { box-shadow: 0 0 80px var(--accent-glow), 0 0 120px rgba(99,102,241,0.15); }
    }

    .name {
      font-size: clamp(2rem, 5vw, 2.8rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.7) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .tagline {
      color: var(--text-secondary);
      font-size: 1.05rem;
      font-weight: 400;
      margin-bottom: 40px;
      letter-spacing: 0.02em;
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 24px;
      border-radius: 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      text-decoration: none;
      color: var(--text-primary);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      position: relative;
      overflow: hidden;
    }

    .link-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 0%, rgba(255,255,255,0.02) 100%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .link-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.3), 0 0 40px var(--accent-glow);
    }

    .link-card:hover::before {
      opacity: 1;
    }

    .link-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 1.3rem;
    }

    .link-icon.tg { background: rgba(36,161,222,0.15); color: #24A1DE; }
    .link-icon.yt { background: rgba(255,0,0,0.12); color: #FF0000; }
    .link-icon.tt { background: rgba(255,0,80,0.12); color: #FF0050; }
    .link-icon.wx { background: rgba(7,193,96,0.15); color: #07C160; }
    .link-icon.mail { background: rgba(99,102,241,0.15); color: #6366f1; }

    .link-info {
      flex: 1;
      min-width: 0;
    }

    .link-title {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 2px;
    }

    .link-handle {
      color: var(--text-secondary);
      font-size: 0.88rem;
      font-weight: 400;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .link-arrow {
      color: var(--text-secondary);
      font-size: 1.1rem;
      transition: transform 0.3s ease, color 0.3s ease;
      flex-shrink: 0;
    }

    .link-card:hover .link-arrow {
      transform: translateX(4px);
      color: var(--text-primary);
    }

    .copy-toast {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(99,102,241,0.95);
      color: white;
      padding: 12px 28px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 100;
      backdrop-filter: blur(12px);
    }

    .copy-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .footer {
      margin-top: 48px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.82rem;
      letter-spacing: 0.02em;
    }

    @media (max-width: 480px) {
      .page { padding: 40px 16px 60px; }
      .link-card { padding: 16px 18px; }
      .link-icon { width: 40px; height: 40px; font-size: 1.1rem; }
    }
  </style>
</head>

  <div class="copy-toast" id="toast"></div>

  <script>
    function copyText(text, label) {
      navigator.clipboard.writeText(text).then(function() {
        showToast(label + ' copied!');
      }).catch(function() {
        var ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(label + ' copied!');
      });
    }

    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(function() { t.classList.remove('show'); }, 2000);
    }
  </script>
